name: Setup NTL (cache or build)
description: Restore cached NTL or build and install into build/ntl-install
runs:
  using: "composite"
  steps:
    - name: Restore cached NTL
      id: cache-ntl
      uses: actions/cache@v4
      with:
        path: build/ntl-install
        key: ntl-${{ hashFiles('scripts/_setup_ntl.sh') }}

    - name: Build NTL
      if: ${{ steps.cache-ntl.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -e
        mkdir -p build
        cd build
        ../scripts/_setup_ntl.sh



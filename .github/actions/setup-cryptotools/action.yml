name: Setup CryptoTools (cache or build)
description: Restore cryptotools for command line parsing
runs:
  using: "composite"
  steps:
    - name: Restore cached
      id: cache-cryptotools
      uses: actions/cache@v6
      with:
        path: build/libOTe-install
        key: cryptotools-${{ hashFiles('scripts/_clone_libote.sh', 'scripts/_setup_cryptotools.sh') }}

    - name: Build cryptotools
      if: ${{ steps.cache-cryptotools.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -e
        mkdir -p build
        cd build
        ../scripts/_setup_cryptotools.sh
